services:
  - type: web
    name: vouchit-backend
    env: node
    plan: free
    rootDir: backend
    # --include=dev is required, not optional: NODE_ENV=production below makes
    # npm skip devDependencies, and @nestjs/cli lives there — so a plain
    # `npm install` builds nothing and the deploy dies on `nest: not found`.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # Run the compiled output directly. `npm run start:prod` would rebuild via
    # its prestart hook on every boot, including every wake from sleep.
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # You must set this manually in the Render dashboard
      - key: JWT_SECRET
        sync: false # Set manually
      - key: RESEND_API_KEY
        sync: false # Set manually
      - key: FRONTEND_URL
        sync: false # Set manually after deploying frontend
      - key: RESEND_FROM_EMAIL
        sync: false # Set manually

      # ── Web3 ──────────────────────────────────────────────────────────────
      # 84532 = Base Sepolia, 8453 = Base mainnet. Both apps default to Sepolia
      # when unset, so a missed variable fails safe instead of touching real
      # funds.
      - key: WEB3_CHAIN_ID
        value: "84532"
      - key: WEB3_RPC_URL
        value: https://sepolia.base.org
      # Deployed VouchitEscrow. Until set, on-chain wagers are rejected rather
      # than silently accepted.
      - key: VOUCHIT_ESCROW_CONTRACT_ADDRESS
        sync: false
      # Contract owner — the ONLY address that can resolve disputes. Anyone
      # holding it can settle any dispute in their own favour. Never commit it;
      # set it in the dashboard only.
      - key: ADMIN_RELAYER_PRIVATE_KEY
        sync: false
      # Receives the 2.5% protocol fee. No private key needed here.
      - key: TREASURY_ADDRESS
        sync: false
      # Without this, wallet-age checks return nothing and every account stays
      # at tier 0. Note the free Etherscan tier does not cover Base mainnet
      # (8453) — only Base Sepolia (84532). Mainnet needs a paid plan.
      - key: BASESCAN_API_KEY
        sync: false
